name: OSOGIL basic quality check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check standalone arcade page
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          text = Path("index.html").read_text(encoding="utf-8")
          assert text.lstrip().lower().startswith("<!doctype html>"), "Missing HTML doctype"
          assert "<title>" in text and "OSOGIL" in text, "Missing title"
          assert "<script>" in text and "</script>" in text, "Missing interactive JS"
          assert text.count("data:image/png;base64,") >= 5, "Pixel-art imagery missing"
          assert "battleship-naval-command.onrender.com" in text, "Battleship link missing"
          assert "quiz-arena-15-online.onrender.com" in text, "Quiz link missing"
          class Parser(HTMLParser):
              pass
          Parser().feed(text)
          print("OSOGIL standalone page smoke checks passed.")
          PY
