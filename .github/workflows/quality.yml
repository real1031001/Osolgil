name: OSOGIL basic quality check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check standalone arcade page
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          text = Path("index.html").read_text(encoding="utf-8")
          assert text.lstrip().lower().startswith("<!doctype html>"), "Missing HTML doctype"
          assert "<title>" in text and "OSOGIL" in text, "Missing title"
          assert "<script>" in text and "</script>" in text, "Missing interactive JS"
          assert text.count("data:image/png;base64,") >= 5, "Pixel-art imagery missing"
          assert "battleship-naval-command.onrender.com" in text, "Battleship link missing"
          assert "quiz-arena-15-online.onrender.com" in text, "Quiz link missing"
          class Parser(HTMLParser):
              pass
          Parser().feed(text)
          print("OSOGIL standalone page smoke checks passed.")
          PY
      - name: Validate Dice Arena entry, Who Am I lock, and JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          page = Path("index.html").read_text(encoding="utf-8")
          dice = re.search(r"\{ id:'dice'.*", page).group(0)
          who = re.search(r"\{ id:'who'.*", page).group(0)
          assert "stage:'playable'" in dice and "url:'https://dice-arena-online.onrender.com'" in dice
          assert "stage:'developing'" in who and "url:null" in who
          assert "const FEATURED=GAMES.filter(g=>g.id!=='who')" in page
          assert "if(locked){card.querySelector('.favorite').remove()" in page
          assert "card.append(overlay);return card}" in page
          assert "card.querySelector('.card-more').addEventListener" in page
          assert "WHO AM I?는 개발 중이며 잠겨 있습니다." in page
          scripts = re.findall(r"<script[^>]*>(.*?)</script>", page, re.S | re.I)
          assert scripts, "No executable JS found"
          Path("_osogil_inline.js").write_text(scripts[-1], encoding="utf-8")
          print("Game status/lock regression checks passed.")
          PY
          node --check _osogil_inline.js
